# AI code review with PR-Agent (open source, MIT) on Claude, from the org's shared
# workflow (tilorahdotco/.github, docs/USAGE.md#pr-agent-review). No model key is
# stored: each run exchanges GitHub's identity token for a 15-minute Anthropic token.
# - Reviews a PR when it opens, reopens or leaves draft.
# - Comment `/review` to run it again, `/improve` for code suggestions, or
#   `/ask <question>`. Comment commands use this workflow from main.
# Keep this file's name: the federation rule accepts only `.github/workflows/pr-agent.yml`.
name: PR-Agent review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # GitHub's identity token, exchanged for the Anthropic token

concurrency:
  # An ordinary comment gets its own group, so it never replaces a queued command.
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/') && github.event.comment.id || 'review' }}
  cancel-in-progress: false

jobs:
  review:
    name: PR-Agent review
    # Only PR events and `/` commands on a PR start a run. The shared workflow
    # re-checks drafts, fork PRs and the comment author's write access.
    if: github.event_name == 'pull_request' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/'))
    uses: tilorahdotco/.github/.github/workflows/pr-agent.yml@cb672ee45c74b2a1a53a4a2ed43b84c89bff0974
    with:
      runner: ubuntu-latest # public repository: GitHub-hosted only
