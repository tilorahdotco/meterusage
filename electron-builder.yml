appId: dev.meterusage.app
productName: MeterUsage
afterPack: Scripts/electron/after-pack.cjs
asar: true
buildVersion: "46"
directories:
  output: release
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
extraResources:
  - from: dist/api-helper/api-usage-helper.cjs
    to: api-usage-helper.cjs
mac:
  extraResources:
    - from: build/desktop-keychain
      to: desktop-keychain
  target:
    - target: zip
      arch: [arm64]
  artifactName: MeterUsage-${version}.zip
  icon: Resources/AppIcon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "13.0"
  identity: "-"
  hardenedRuntime: true
  notarize: false
  extendInfo:
    LSUIElement: true
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
# Unsigned Windows builds (ADR 0038). SmartScreen warns until a code-signing
# certificate exists; nothing here signs or publishes.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: MeterUsage-${version}-win-${arch}.${ext}
  icon: Resources/AppIcon.png
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: MeterUsage
  deleteAppDataOnUninstall: false
